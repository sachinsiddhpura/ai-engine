[project]
name = "ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sachinsiddhpura", email = "sachinsiddhpura007@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.16.0",
    "bitsandbytes>=0.50.2",
    "fastapi>=0.163.2",
    "huggingface-hub>=2.4.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.8.1",
    "langgraph>=1.2.22",
    "mcp>=1.30.0",
    "openai>=3.55.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "python-multipart>=0.0.34",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
    "transformers>=5.23.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-agent = "ai_agent:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
